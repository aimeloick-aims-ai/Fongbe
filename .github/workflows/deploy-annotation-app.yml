name: Publish Fongbe annotation app

on:
  push:
    branches: [main]
    paths:
      - "annotation_app/**"
      - ".github/workflows/deploy-annotation-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: annotation_app
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
